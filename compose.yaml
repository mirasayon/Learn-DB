services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: learn_db_demo_only
      POSTGRES_DB: expdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/products.sql:/docker-entrypoint-initdb.d/products.sql:ro

volumes:
  pgdata:
